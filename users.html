<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 Royale — Find People</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><style>:root{--bg:#070809;--panel:#101216;--panel2:#171a20;--line:#282c35;--text:#f6f7f8;--muted:#9298a5;--lime:#c8ff2e;--gold:#ffd45a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% -10%,#273014,transparent 35%),var(--bg);color:var(--text);font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{font-size:28px;font-weight:1000;letter-spacing:-2px}.logo span{color:var(--lime)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);outline:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.user{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:1000}.name{font-weight:950}.handle{font-size:12px;color:var(--muted)}.spacer{margin-left:auto}.following{color:var(--lime)}.hint{color:var(--muted);line-height:1.5}.empty{text-align:center;padding:30px;color:var(--muted)}</style></head><body><div class="wrap"><header class="top"><button class="btn" onclick="location.href='/app'">← Home</button><div class="logo">67 <span>ROYALE</span></div></header><section class="panel"><h1 style="margin:0 0 5px">Find people</h1><div class="hint">Search 67 members by username or display name, then follow the people you want in your feed.</div><div class="search" style="margin-top:14px"><input id="q" placeholder="Search @username or name…" autocomplete="off"><button class="btn" onclick="searchUsers()">Search</button></div><div id="results"><div class="empty">Start typing to find 67 members.</div></div></section></div><script>const client=get67AuthClient();let currentUser=null;async function init(){const {data:{user}}=await client.auth.getUser();currentUser=user;document.getElementById('q').addEventListener('input',()=>{clearTimeout(window.__t);window.__t=setTimeout(searchUsers,250)});searchUsers()}async function searchUsers(){const q=document.getElementById('q').value.trim();const box=document.getElementById('results');if(q.length<2){box.innerHTML='<div class="empty">Enter at least 2 characters.</div>';return}const safe=q.replace(/[%_,]/g,' ');const {data,error}=await client.from('profiles').select('id,username,display_name').or(`username.ilike.%${safe}%,display_name.ilike.%${safe}%`).limit(20);if(error){box.innerHTML='<div class="empty">Search is temporarily unavailable.</div>';console.error(error);return}if(!data?.length){box.innerHTML='<div class="empty">No 67 members found.</div>';return}let following=new Set();if(currentUser){const {data:f}=await client.from('follows').select('following_id').eq('follower_id',currentUser.id).in('following_id',data.map(x=>x.id));following=new Set((f||[]).map(x=>x.following_id))}box.innerHTML=data.map(u=>{const name=u.display_name||u.username||'67 member';const handle=u.username?'@'+u.username:'@member';const own=currentUser?.id===u.id;const isFollowing=following.has(u.id);return `<div class="user"><div class="avatar">${escapeHtml(name[0]||'6').toUpperCase()}</div><div><div class="name">${escapeHtml(name)}</div><div class="handle">${escapeHtml(handle)}</div></div><div class="spacer">${own?'<span class="handle">You</span>':`<button class="btn ${isFollowing?'following':''}" onclick="toggleFollow('${u.id}',${isFollowing})">${isFollowing?'Following':'Follow'}</button>`}</div></div>`}).join('')}async function toggleFollow(id,isFollowing){if(!currentUser){alert('Sign in to follow people.');return}const r=isFollowing?await client.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',id):await client.from('follows').insert({follower_id:currentUser.id,following_id:id});if(r.error){alert('Could not update follow.');return}searchUsers()}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}init();</script></body></html>
