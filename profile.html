<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 Royale — Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><style>body{margin:0;background:#08090b;color:#f5f6f8;font:14px system-ui}.wrap{max-width:720px;margin:40px auto;padding:20px}.card{background:#101216;border:1px solid #292d37;border-radius:18px;padding:22px}.avatar{width:80px;height:80px;border-radius:20px;background:#c9ff38;color:#08090b;display:grid;place-items:center;font-size:30px;font-weight:900}.row{display:flex;gap:16px;align-items:center}.muted{color:#9399a5}.stat{display:inline-block;background:#171a20;border:1px solid #292d37;padding:10px;border-radius:10px;margin:5px}.btn{border:1px solid #292d37;background:#171a20;color:#fff;padding:10px 13px;border-radius:9px;cursor:pointer}.primary{background:#c9ff38;color:#08090b;font-weight:900}.input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;background:#171a20;border:1px solid #292d37;border-radius:9px;color:#fff}.actions{margin-top:18px;display:flex;gap:8px}</style></head><body><div class="wrap"><div class="card"><div class="row"><div class="avatar" id="avatar">67</div><div><h1 id="name">Loading...</h1><div class="muted" id="handle"></div></div></div><div style="margin-top:18px"><span class="stat">⚔️ <b id="elo">1000</b> ELO</span><span class="stat">👑 <b id="royals">0</b> Royals</span><span class="stat">🔥 <b id="streak">0</b> day streak</span></div><p class="muted" id="bio">No bio yet.</p><div class="actions"><button class="btn primary" onclick="editProfile()">Edit profile</button><button class="btn" onclick="location.href='index.html'">Back to 67</button></div><div id="editor" style="display:none;margin-top:18px"><input class="input" id="display" maxlength="60" placeholder="Display name"><input class="input" id="username" maxlength="30" placeholder="Username"><textarea class="input" id="bioInput" maxlength="280" rows="4" placeholder="Bio"></textarea><button class="btn primary" onclick="saveProfile()">Save profile</button></div></div></div><script>const sb=window.get67AuthClient();let user;async function init(){const r=await sb.auth.getUser();user=r.data.user;if(!user){location.href='index.html';return}let p=await sb.from('profiles').select('username,display_name,bio,elo,royals,streak_days').eq('id',user.id).maybeSingle();if(p.data){document.getElementById('name').textContent=p.data.display_name||p.data.username;document.getElementById('handle').textContent='@'+p.data.username;document.getElementById('bio').textContent=p.data.bio||'No bio yet.';document.getElementById('elo').textContent=p.data.elo;document.getElementById('royals').textContent=p.data.royals;document.getElementById('streak').textContent=p.data.streak_days}}function editProfile(){document.getElementById('editor').style.display='block';sb.from('profiles').select('username,display_name,bio').eq('id',user.id).maybeSingle().then(({data})=>{if(data){display.value=data.display_name||'';username.value=data.username||'';bioInput.value=data.bio||''}})}async function saveProfile(){const updates={display_name:display.value.trim()||null,username:username.value.trim(),bio:bioInput.value.trim()||null};const r=await sb.from('profiles').update(updates).eq('id',user.id);if(r.error){alert(r.error.message);return}location.reload()}init();</script></body></html>
