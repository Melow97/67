<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><style>body{margin:0;background:#070809;color:#f5f6f8;font:14px system-ui}main{max-width:850px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:14px;margin-bottom:25px}.logo{font-size:28px;font-weight:1000;cursor:pointer}.logo span{color:#c8ff2e}.btn{border:1px solid #2a2e36;background:#15181e;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.chat{border:1px solid #292d36;border-radius:18px;background:#101216;min-height:55vh;padding:18px}.msg{padding:12px 14px;border-radius:13px;margin:9px 0;max-width:80%;line-height:1.5}.user{margin-left:auto;background:#c8ff2e;color:#080a08}.ai{background:#191c22}.bar{display:flex;gap:8px;margin-top:12px}.input{flex:1;background:#101216;border:1px solid #292d36;color:#fff;border-radius:12px;padding:13px;outline:0}.send{background:#c8ff2e;color:#080a08;font-weight:900}.muted{color:#9298a5;font-size:12px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{background:#15181e;border:1px solid #292d36;color:#fff;padding:7px 10px;border-radius:9px;cursor:pointer}</style></head><body><main><header class="top"><div class="logo" onclick="location.href='/app'">67 <span>ROYALE</span></div><button class="btn" onclick="location.href='/app'">⌂ Home</button><button class="btn" onclick="location.href='/battle.html'">⚔ Royale</button><div style="margin-left:auto" class="muted">67 AI</div></header><h1>🧠 67 AI</h1><div class="muted">Fast answers for internet culture, memes, crypto, NFTs, streamers and gaming.</div><div class="chips"><button class="chip" onclick="ask('What is trending right now?')">🔥 What's trending?</button><button class="chip" onclick="ask('Explain the latest internet slang')">😂 Slang</button><button class="chip" onclick="ask('What is happening in crypto right now?')">🪙 Crypto</button><button class="chip" onclick="ask('What are streamers talking about?')">🎥 Streamers</button></div><section class="chat" id="chat"><div class="msg ai">I'm 67 AI. Ask me what's moving, explain a meme, compare two trends, or help judge a Royale battle.</div></section><div class="bar"><input class="input" id="input" placeholder="Ask 67 AI…" maxlength="4000"><button class="btn send" onclick="ask()">Send</button></div></main><script>async function ask(p){const input=document.getElementById('input');const text=(p||input.value).trim();if(!text)return;const chat=document.getElementById('chat');chat.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text)}</div>`);input.value='';const loading=document.createElement('div');loading.className='msg ai';loading.textContent='67 AI is thinking…';chat.appendChild(loading);try{const{data:{session}}=await get67AuthClient().auth.getSession();if(!session){loading.textContent='Sign in to use 67 AI.';return}const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({input:text,messages:[{role:'user',content:text}]})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI unavailable');loading.textContent=d.reply||'No response.'}catch(e){loading.textContent='67 AI is temporarily unavailable. Try again in a moment.';console.error(e)}chat.scrollTop=chat.scrollHeight}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});</script></body></html>
