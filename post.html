<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 — Discussion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><style>body{margin:0;background:#070809;color:#f5f6f8;font:14px system-ui}.wrap{max-width:760px;margin:auto;padding:18px}.btn{border:1px solid #292d36;background:#15181e;color:#fff;padding:9px 12px;border-radius:10px}.card{background:#101216;border:1px solid #292d36;border-radius:16px;padding:16px;margin-top:14px}.input{width:100%;box-sizing:border-box;background:#15181e;color:#fff;border:1px solid #292d36;border-radius:10px;padding:12px}.comment{border-top:1px solid #292d36;padding:12px 0}.reply{margin-left:28px;border-left:2px solid #292d36;padding-left:14px}.muted{color:#9298a5}</style></head><body><div class="wrap"><button class="btn" onclick="location.href='/app'">67 ROYALE · Home</button><div id="post" class="card">Loading…</div><div class="card"><b>Comments</b><div id="comments"></div><textarea id="body" class="input" rows="3" placeholder="Add to the discussion…" style="margin-top:12px"></textarea><button class="btn" style="margin-top:8px" onclick="comment()">Reply</button></div></div><script>const id=new URLSearchParams(location.search).get('id');async function load(){const c=get67AuthClient();const{data:p}=await c.from('posts').select('id,body,created_at,profiles(username,display_name)').eq('id',id).maybeSingle();if(!p){document.getElementById('post').textContent='Post not found';return}document.getElementById('post').innerHTML='<h2>67 Discussion</h2><p>'+esc(p.body)+'</p><div class="muted">@'+esc(p.profiles?.username||'member')+' · '+new Date(p.created_at).toLocaleString()+'</div>';const{data:cs}=await c.from('comments').select('id,parent_id,body,created_at,profiles(username,display_name)').eq('post_id',id).order('created_at');const root=(cs||[]).filter(x=>!x.parent_id);document.getElementById('comments').innerHTML=root.map(x=>render(x,cs||[])).join('')||'<p class="muted">No comments yet.</p>'}function render(x,all){const replies=all.filter(r=>String(r.parent_id)===String(x.id));return '<div class="comment"><b>@'+esc(x.profiles?.username||'member')+'</b><div>'+esc(x.body)+'</div><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div>'+replies.map(r=>'<div class="reply"><b>@'+esc(r.profiles?.username||'member')+'</b><div>'+esc(r.body)+'</div></div>').join('')+'</div>'}async function comment(){const b=document.getElementById('body').value.trim();if(!b||!id)return;const{data:{user}}=await get67AuthClient().auth.getUser();if(!user){alert('Sign in to comment');return}const{error}=await get67AuthClient().from('comments').insert({post_id:id,user_id:user.id,body:b});if(error)alert('Could not post comment');else{document.getElementById('body').value='';load()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
