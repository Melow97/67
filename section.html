<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 — Feed</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><style>:root{--bg:#070809;--p:#101216;--p2:#171a20;--line:#292d36;--t:#f5f6f8;--m:#9298a5;--lime:#c8ff2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding-bottom:14px}.logo{font-size:27px;font-weight:1000;cursor:pointer}.logo span{color:var(--lime)}.btn{border:1px solid var(--line);background:var(--p2);color:var(--t);padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.hero,.post{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.hero h1{margin:5px 0;font-size:30px}.muted{color:var(--m)}.posthead{display:flex;gap:9px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-weight:900}.content{margin:12px 0;line-height:1.5}.actions{display:flex;gap:7px}.react{border:1px solid var(--line);background:var(--p2);color:var(--t);padding:7px 9px;border-radius:8px}.empty{padding:30px;text-align:center;color:var(--m)}</style></head><body><div class="wrap"><header class="top"><div class="logo" onclick="location.href='/app'">67 <span>ROYALE</span></div><button class="btn" onclick="location.href='/app'">⌂ Home</button><button class="btn" onclick="location.href='/battle.html'">⚔ Royale</button><button class="btn" onclick="location.href='/ai.html'">🧠 AI</button><div style="margin-left:auto"><button class="btn" onclick="location.href='/users.html'">🔎 People</button></div></header><section class="hero"><div class="muted">67 CHANNEL</div><h1 id="title">Loading…</h1><div class="muted" id="desc">Live community feed.</div></section><main id="feed"></main></div><script>const map={trending:['🔥 Trending','What the 67 community is reacting to right now.'],crypto:['🪙 Crypto','Crypto narratives, coins, markets and community takes.'],nfts:['🖼️ NFTs','NFT culture, collections and digital ownership.'],streamers:['🎥 Streamers','Streamer moments, clips, drama and internet culture.'],gaming:['🎮 Gaming','Games, launches, clips and gaming culture.']};const key=new URLSearchParams(location.search).get('category')||'trending';const meta=map[key]||map.trending;document.title='67 — '+meta[0];document.getElementById('title').textContent=meta[0];document.getElementById('desc').textContent=meta[1];async function load(){const c=get67AuthClient();const{data,error}=await c.from('posts').select('id,body,category,created_at,profiles(username,display_name)').eq('category',key).order('created_at',{ascending:false}).limit(50);const f=document.getElementById('feed');if(error){f.innerHTML='<div class="post empty">This channel is getting ready. Check back soon.</div>';return}if(!data?.length){f.innerHTML='<div class="post empty">No posts here yet. Be the first to post.</div>';return}f.innerHTML=data.map(p=>`<article class="post"><div class="posthead"><div class="avatar">${(p.profiles?.display_name||p.profiles?.username||'6')[0].toUpperCase()}</div><div><b>${esc(p.profiles?.display_name||p.profiles?.username||'67 member')}</b><div class="muted">@${esc(p.profiles?.username||'member')} · ${new Date(p.created_at).toLocaleString()}</div></div></div><div class="content">${esc(p.body)}</div><div class="actions"><button class="react">🔥 Banger</button><button class="react">💀</button><button class="react" onclick="location.href='/post.html?id=${encodeURIComponent(p.id)}'">💬 Discuss</button></div></article>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
