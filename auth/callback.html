<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 Royale — Signing you in</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090b;color:#f5f6f8;font:14px system-ui}.box{width:min(420px,calc(100% - 40px));padding:28px;border:1px solid #292d37;border-radius:18px;background:#101216;text-align:center}.logo{font-size:30px;font-weight:1000}.logo span{color:#c9ff38}.muted{color:#9399a5;line-height:1.5}.spin{width:28px;height:28px;border:3px solid #292d37;border-top-color:#c9ff38;border-radius:50%;animation:r .8s linear infinite;margin:18px auto}@keyframes r{to{transform:rotate(360deg)}}.error{color:#ff5470}</style></head><body><main class="box"><div class="logo">67 <span>ROYALE</span></div><div class="spin"></div><h2 id="title">Signing you in…</h2><p id="message" class="muted">Finishing your secure Google sign-in.</p></main><script>(async()=>{const client=get67AuthClient();const title=document.getElementById('title'),msg=document.getElementById('message');const productionHome=new URL('/app',window.SITE_URL_67).toString();const fallback=()=>{const u=new URL('/app',window.SITE_URL_67);u.searchParams.set('auth_error','1');window.location.replace(u.toString())};try{const url=new URL(window.location.href);const code=url.searchParams.get('code');const error=url.searchParams.get('error');const errorDescription=url.searchParams.get('error_description');if(error)throw new Error(errorDescription?decodeURIComponent(errorDescription.replace(/\+/g,' ')):error);if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error)throw error}const {data:{session},error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;if(!session)throw new Error('No authenticated session was returned. Please try signing in again.');const user=session.user;let {data:profile,error:profileError}=await client.from('profiles').select('id,age_confirmed_at,terms_accepted_at,privacy_accepted_at,community_rules_accepted_at').eq('id',user.id).maybeSingle();if(profileError)throw profileError;if(!profile){const username='user_'+user.id.slice(0,8);const {data:newProfile,error:e}=await client.from('profiles').insert({id:user.id,username,display_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'67 member'}).select('id,age_confirmed_at,terms_accepted_at,privacy_accepted_at,community_rules_accepted_at').single();if(e&&e.code!=='23505')throw e;profile=newProfile||null}const compliant=!!(profile?.age_confirmed_at&&profile?.terms_accepted_at&&profile?.privacy_accepted_at&&profile?.community_rules_accepted_at);title.textContent=compliant?'Welcome back':'Almost there';msg.textContent=compliant?'Returning you to 67 Royale…':'Account created. Returning you to 67 to complete onboarding…';window.history.replaceState({},document.title,window.location.pathname);const destination=new URL(productionHome);if(!compliant)destination.searchParams.set('onboarding','1');setTimeout(()=>window.location.replace(destination.toString()),250)}catch(e){console.error('67 OAuth callback error:',e);title.textContent='Sign-in failed';title.className='error';msg.textContent=e.message||'Authentication could not be completed.';setTimeout(fallback,2500)}})();</script></body></html>
