[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  framework = "#static"
  targetPort = 5173
  port = 5173

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/auth/callback.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
